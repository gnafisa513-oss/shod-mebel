<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHOD Mebel</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1>SHOD Mebel</h1>
            <button id="adminAddProductBtn" class="admin-btn hidden">+ Mebel Qo'shish</button>
        </header>

        <!-- Kategoriya Bo'limlari -->
        <div class="categories">
            <button class="cat-btn active" data-cat="all">Barchasi</button>
            <button class="cat-btn" data-cat="Yotoqxona">Yotoqxona</button>
            <button class="cat-btn" data-cat="Mehmonxona">Mehmonxona</button>
            <button class="cat-btn" data-cat="Oshxona">Oshxona</button>
            <button class="cat-btn" data-cat="Ofis">Ofis</button>
        </div>

        <!-- Mebellar Katalogi -->
        <main>
            <div id="productsGrid" class="products-grid">
                <!-- Mebellar JS orqali shu yerga yuklanadi -->
            </div>
        </main>
    </div>

    <!-- Admin Modal (Yangi mebel qo'shish oynasi) -->
    <div id="adminProductModalOverlay" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Yangi Mebel Qo'shish</h2>
                <button id="closeAdminModalBtn" class="close-btn">&times;</button>
            </div>
            <form id="adminAddProductForm">
                <input type="text" id="newProdTitle" placeholder="Mebel nomi" required>
                <select id="newProdCategory" required>
                    <option value="Yotoqxona">Yotoqxona</option>
                    <option value="Mehmonxona">Mehmonxona</option>
                    <option value="Oshxona">Oshxona</option>
                    <option value="Ofis">Ofis</option>
                </select>
                <input type="number" id="newProdPrice" placeholder="Narxi (so'm)" required>
                <input type="text" id="newProdMediaUrl" placeholder="Rasm URL manzili" required>
                <textarea id="newProdDesc" placeholder="Tavsif (ixtiyoriy)"></textarea>
                <div class="form-row">
                    <input type="text" id="newProdHeight" placeholder="Balandligi">
                    <input type="text" id="newProdWidth" placeholder="Eni">
                </div>
                <div class="form-row">
                    <input type="text" id="newProdColor" placeholder="Rangi">
                    <input type="text" id="newProdMaterial" placeholder="Materiali">
                </div>
                <label class="checkbox-label">
                    <input type="checkbox" id="newProdIsCustom"> Buyurtma asosida
                </label>
                <button type="submit" class="submit-btn">Saqlash</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
